<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app shell — sticky top bar (desktop nav) + centered 1120px content; phones get a bottom tab bar. */
:root {
  --bg: #FAFAF7; --surface: #FFFFFF; --soft: #EDF3EE;
  --primary: #246B50; --on-primary: #FFFFFF; --primary-soft: #DCEBE2; --primary-ink: #1A5039;
  --ink: #202824; --muted: #66706B; --faint: #9AA39E;
  --line: #E7E9E4; --line-strong: #D5DAD4;
  --sand: #E9C46A; --sand-soft: #FBF3DF; --amber: #A9711A;
  --info: #2F5E8C; --info-soft: #E7EEF6; --danger: #B4493A; --danger-soft: #FAEAE6;
  --shadow: 0 1px 2px rgba(32,40,36,.04), 0 8px 24px rgba(32,40,36,.06);
  --c-elderly: #9B4B5C; --c-moving: #A0583A; --c-eco: #3F7D62; --c-education: #3A6A93;
  --c-food: #94701F; --c-animals: #7A4F7E; --c-events: #2E7476; --c-tech: #4F5D6B;
  --font: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111714; --surface: #18201C; --soft: #202B26;
  --primary: #4FAE84; --on-primary: #0C1A13; --primary-soft: #1D3a2E; --primary-ink: #8FD3B2;
  --ink: #E7EDE9; --muted: #A2ADA7; --faint: #6F7A74;
  --line: #27322D; --line-strong: #34413B;
  --sand: #E9C46A; --sand-soft: #352D1C; --amber: #E2B55C;
  --info: #8DB5DD; --info-soft: #1C2936; --danger: #E68C7E; --danger-soft: #3A2320;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --c-elderly: #E08FA0; --c-moving: #E39B79; --c-eco: #7CC7A4; --c-education: #8DB7E0;
  --c-food: #DDB55C; --c-animals: #C59ACA; --c-events: #72C3C5; --c-tech: #A9B6C4;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111714; --surface: #18201C; --soft: #202B26;
  --primary: #4FAE84; --on-primary: #0C1A13; --primary-soft: #1D3a2E; --primary-ink: #8FD3B2;
  --ink: #E7EDE9; --muted: #A2ADA7; --faint: #6F7A74;
  --line: #27322D; --line-strong: #34413B;
  --sand: #E9C46A; --sand-soft: #352D1C; --amber: #E2B55C;
  --info: #8DB5DD; --info-soft: #1C2936; --danger: #E68C7E; --danger-soft: #3A2320;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --c-elderly: #E08FA0; --c-moving: #E39B79; --c-eco: #7CC7A4; --c-education: #8DB7E0;
  --c-food: #DDB55C; --c-animals: #C59ACA; --c-events: #72C3C5; --c-tech: #A9B6C4;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 13px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; }
.ic { width: 20px; height: 20px; flex: none; }
.ic.s { width: 16px; height: 16px; } .ic.xs { width: 14px; height: 14px; } .ic.l { width: 24px; height: 24px; }
.accent { color: var(--primary); }

/* category tint */
[class*="cat-"] { --c: var(--c-tech); }
.cat-elderly { --c: var(--c-elderly); } .cat-moving { --c: var(--c-moving); } .cat-eco { --c: var(--c-eco); }
.cat-education { --c: var(--c-education); } .cat-food { --c: var(--c-food); } .cat-animals { --c: var(--c-animals); }
.cat-events { --c: var(--c-events); } .cat-tech { --c: var(--c-tech); }
.cat-tile { display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); border-radius: 32%; flex: none; }
.cat-label { color: var(--c); font-weight: 600; font-size: 13px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 20px; border-radius: var(--r-md); border: 1px solid transparent; font-weight: 600; font-size: 15px; white-space: nowrap; transition: transform .12s ease, background-color .2s, opacity .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.sm { height: 40px; padding: 0 16px; font-size: 14px; border-radius: 14px; }
.btn.md { height: 44px; }
.btn.block { width: 100%; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn.secondary:hover:not(:disabled) { background: var(--soft); }
.btn.tonal { background: var(--primary-soft); color: var(--primary-ink); }
.btn.danger-text { color: var(--danger); }
.btn.quiet { background: none; color: var(--primary); height: auto; padding: 8px 10px; }
.btn:disabled { cursor: default; }
.btn.primary:disabled { background: var(--soft); color: var(--muted); }
.btn.tonal:disabled, .btn.secondary:disabled { opacity: .85; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; position: relative; flex: none; }
.icon-btn:hover { background: var(--soft); }
.dot-badge { position: absolute; top: 6px; right: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--sand); border: 2px solid var(--surface); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 500; white-space: nowrap; color: var(--pf); background: var(--pb); }
.pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-primary { --pf: var(--primary-ink); --pb: var(--primary-soft); }
.p-info { --pf: var(--info); --pb: var(--info-soft); }
.p-amber { --pf: var(--amber); --pb: var(--sand-soft); }
.p-danger { --pf: var(--danger); --pb: var(--danger-soft); }
.p-neutral { --pf: var(--ink); --pb: var(--soft); }
.p-muted { --pf: var(--muted); --pb: var(--soft); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.card.elev { box-shadow: var(--shadow); }
.card[role="button"] { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; }
.card[role="button"]:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(32,40,36,.05), 0 14px 32px rgba(32,40,36,.09); }

.avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--surface)); flex: none; letter-spacing: 0; }
.avatar.ring { box-shadow: 0 0 0 3px var(--surface); }
.av-stack { display: flex; } .av-stack .avatar + .avatar { margin-left: -8px; }

.progress { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.progress > i { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .6s ease; }
.stars { display: inline-flex; gap: 1px; color: var(--sand); }
.stars .off { color: var(--line-strong); }

/* segmented */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border-radius: var(--r-md); padding: 4px; height: 48px; }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 3px rgba(32,40,36,.08); transition: transform .3s cubic-bezier(.3,.8,.3,1); }
.seg button { position: relative; z-index: 1; border: 0; background: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; color: var(--muted); border-radius: 12px; }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg button[aria-pressed="true"] .ic { color: var(--primary); }

/* fields */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label { font-weight: 600; font-size: 14px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 16px; font-size: 16px; transition: border-color .2s; resize: vertical; }
.input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
.input.err { border-color: var(--danger); }
.input::placeholder { color: var(--faint); }
.help { font-size: 13px; color: var(--muted); }
.help.err { color: var(--danger); }
.input-wrap { position: relative; }
.input-wrap .input { padding-left: 46px; }
.input-wrap > .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.input-wrap > .toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 50%; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; color: var(--ink); transition: background-color .2s, border-color .2s, color .2s; }
.chip .ic { color: var(--muted); }
.chip:hover { border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-ink); }
.chip[aria-pressed="true"] .ic { color: var(--primary-ink); }
.chip.dark[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.dark[aria-pressed="true"] .ic { color: var(--bg); }
.chip.info { background: var(--info-soft); border-color: transparent; color: var(--info); font-weight: 500; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { flex: none; }

/* ===== app shell ===== */
#app { min-height: 100%; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: -0.04em; border: 0; background: none; padding: 0; }
.logo svg { flex: none; }
.nav { display: none; gap: 4px; }
.nav button { border: 0; background: none; height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; position: relative; }
.nav button:hover { background: var(--soft); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); }
.nav .nb { background: var(--sand); color: #202824; font-size: 11px; font-weight: 700; border-radius: 99px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; }
.top-role { display: none; width: 280px; }
.top-role .seg { height: 42px; }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 110px; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(4, 1fr); }
.bottom-nav button { border: 0; background: none; height: 66px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 500; color: var(--faint); position: relative; }
.bottom-nav .bi { padding: 4px 18px; border-radius: 99px; transition: background-color .2s; position: relative; }
.bottom-nav button[aria-current="page"] { color: var(--primary); font-weight: 700; }
.bottom-nav button[aria-current="page"] .bi { background: var(--primary-soft); }
.bottom-nav .create .bi { background: var(--primary); color: var(--on-primary); border-radius: 14px; padding: 5px 14px; box-shadow: 0 6px 14px color-mix(in srgb, var(--primary) 35%, transparent); }
.bottom-nav .nb { position: absolute; top: -2px; right: 6px; background: var(--sand); color: #202824; font-size: 10px; font-weight: 700; border-radius: 99px; min-width: 16px; height: 16px; display: grid; place-items: center; }
@media (min-width: 900px) {
  .nav { display: flex; }
  .top-role { display: block; }
  .bottom-nav { display: none; }
  .mobile-only-role { display: none; }
  main { padding-bottom: 64px; padding-top: 28px; }
}

/* ===== welcome / auth ===== */
.welcome { min-height: 100vh; max-width: 1120px; margin: 0 auto; padding-block: 24px; padding-inline: 20px; display: grid; gap: 24px; align-content: start; }
.welcome .copy { display: flex; flex-direction: column; gap: 14px; }
.welcome h1 { font-size: clamp(36px, 6vw, 58px); line-height: 1.04; font-weight: 800; letter-spacing: -0.035em; }
.welcome .lede { font-size: 17px; color: var(--muted); max-width: 30em; }
.welcome .ctas { display: grid; gap: 10px; max-width: 420px; margin-top: 10px; }
.welcome .fine { font-size: 12.5px; color: var(--faint); }
.orbit { position: relative; width: min(100%, 420px); aspect-ratio: 1; margin: 0 auto; max-width: 100%; }
.orbit .ringa, .orbit .ringb, .orbit .core { position: absolute; border-radius: 50%; inset: 0; margin: auto; }
.orbit .ringa { background: color-mix(in srgb, var(--soft) 55%, transparent); border: 1px solid var(--line); }
.orbit .ringb { width: 72%; height: 72%; background: var(--soft); }
.orbit .core { width: 44%; height: 44%; background: var(--primary-soft); display: grid; place-items: center; }
.orbit .heart { width: 52%; height: 52%; border-radius: 50%; background: var(--primary); display: grid; place-items: center; color: var(--sand); box-shadow: 0 12px 30px color-mix(in srgb, var(--primary) 35%, transparent); }
.orbit .b { position: absolute; transform: translate(-50%, -50%); animation: float 6s ease-in-out infinite; }
.orbit .b > div { box-shadow: var(--shadow); background: var(--surface); padding: 4px; border-radius: 50%; }
.orbit .b.sq > div { border-radius: 16px; padding: 5px; }
.orbit .b.chipb > div { border-radius: 99px; padding: 8px 14px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.orbit .b.chipb i { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
@keyframes float { 0%,100% { translate: 0 -5px; } 50% { translate: 0 5px; } }
@media (prefers-reduced-motion: reduce) { .orbit .b { animation: none; } * { transition: none !important; } }
@media (min-width: 900px) {
  .welcome { grid-template-columns: 1.05fr 1fr; align-content: center; gap: 48px; }
  .welcome .brand { grid-column: 1 / -1; }
}
.auth { max-width: 460px; margin: 0 auto; padding-block: 16px 40px; padding-inline: 20px; display: flex; flex-direction: column; gap: 20px; }
.auth h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; }
.notice { border-radius: 18px; padding: 14px 16px; display: flex; gap: 10px; font-size: 13.5px; }
.notice.amber { background: var(--sand-soft); color: var(--ink); }
.notice.amber .ic, .notice.amber b { color: var(--amber); }
.notice.info { background: var(--info-soft); color: var(--ink); }
.notice.info .ic, .notice.info b { color: var(--info); }
.notice.err { background: var(--danger-soft); color: var(--danger); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--amber); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ===== home ===== */
.home-hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin-bottom: 26px; }
.home-hero > * { min-width: 0; }
.greet { display: flex; align-items: center; gap: 12px; }
.greet .name { font-weight: 600; font-size: 16px; }
.home-hero h1 { font-size: clamp(30px, 4.6vw, 44px); line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; margin-top: 6px; }
.search { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
.search:focus-within { border-color: var(--primary); }
.search input { border: 0; background: none; flex: 1; min-width: 0; font-size: 16px; outline: none; }
.search .ic { color: var(--muted); }
.search .clear { border: 0; background: none; color: var(--muted); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
.impact { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px 4px; }
.impact > div { text-align: center; padding: 0 6px; }
.impact > div + div { border-left: 1px solid var(--line); }
.impact b { display: block; font-size: 22px; color: var(--primary); letter-spacing: -0.02em; }
.impact span { font-size: 12.5px; color: var(--muted); line-height: 1.35; display: block; }
.impact-cap { font-size: 12px; color: var(--faint); margin-top: 8px; text-align: right; }
.req-hero { background: var(--primary); color: var(--on-primary); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.req-hero h2 { font-size: 22px; }
.req-hero p { opacity: .85; font-size: 14px; }
.req-hero .row { margin-top: 10px; gap: 14px; flex-wrap: wrap; }
.req-hero .btn { background: var(--on-primary); color: var(--primary); }
.req-hero .manage { border: 0; background: none; color: inherit; text-align: left; font-size: 13px; padding: 0; }
.req-hero .manage b { color: var(--sand); }
.section-head { display: flex; align-items: flex-end; gap: 12px; margin: 26px 0 12px; }
.section-head h2 { font-size: 20px; font-weight: 700; }
.section-head .sub { font-size: 13px; color: var(--muted); }
.feed { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); }
.task { display: flex; flex-direction: column; gap: 10px; }
.task-head { display: flex; align-items: center; gap: 12px; }
.task-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta .ic { color: var(--faint); }
.slots-row { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.slots-row .ic { color: var(--primary); }
.task-foot { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: auto; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
.who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 900px) {
  .home-hero { grid-template-columns: 1.1fr .9fr; align-items: end; gap: 32px; }
}
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; grid-column: 1 / -1; }
.empty .em-ic { width: 64px; height: 64px; border-radius: 50%; background: var(--soft); color: var(--primary); display: grid; place-items: center; margin-bottom: 8px; }
.empty h3 { font-size: 17px; }
.empty p { color: var(--muted); max-width: 32em; }

/* ===== details ===== */
.back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; font-weight: 600; }
.details { display: grid; gap: 28px; }
.details .main-col { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.details h1 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.12; }
.details h2 { font-size: 19px; font-weight: 700; margin-bottom: 10px; }
.details .about { font-size: 16.5px; line-height: 1.6; max-width: 62ch; }
.facts { display: flex; flex-direction: column; gap: 14px; }
.fact { display: flex; align-items: center; gap: 12px; }
.fact .fi { width: 40px; height: 40px; border-radius: 12px; background: var(--soft); color: var(--primary); display: grid; place-items: center; flex: none; }
.fact small { display: block; color: var(--muted); font-size: 12.5px; }
.fact b { font-weight: 600; font-size: 14.5px; }
.side-col { display: flex; flex-direction: column; gap: 14px; }
.action-panel .btn { width: 100%; }
.mobile-actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.mobile-actions .btn { width: 100%; }
.desk-actions { display: none; }
@media (min-width: 900px) {
  .details { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; gap: 40px; }

// Rule-based keyword analyzer. Runs in the browser; not connected to any AI model.
const KW = {
  elderly: ["grandmother", "grandfather", "grandma", "grandpa", "elderly", "senior", "pensioner", "veteran", "old lady", "old man", "ateje", "babushka", "бабушк", "дедушк", "пожил", "пенсионер", "әже", "care", "medicine", "pharmacy", "lives alone"],
  moving: ["move", "moving", "furniture", "sofa", "wardrobe", "fridge", "piano", "boxes", "carry", "lift", "truck", "переезд", "мебел", "грузч", "assemble"],
  eco: ["cleanup", "clean up", "litter", "trash", "garbage", "recycl", "plastic", "tree", "plant", "park", "lake", "river", "субботник", "мусор", "eco", "green", "waste"],
  education: ["tutor", "teach", "lesson", "homework", "math", "english", "exam", "school", "student", "study", "reading", "репетитор", "урок", "learn", "library"],
  food: ["food", "meal", "cook", "parcel", "donation", "kitchen", "bread", "soup", "hungry", "еда", "продукт", "iftar", "food bank", "packing"],
  animals: ["dog", "cat", "shelter", "animal", "pet", "puppy", "kitten", "vet", "walk the", "собак", "кошк", "приют"],
  events: ["event", "festival", "nauryz", "наурыз", "concert", "celebration", "decorat", "marathon", "registration desk", "tent", "stage", "fair"],
  tech: ["smartphone", "phone", "laptop", "computer", "internet", "app", "whatsapp", "telegram", "video call", "printer", "wifi", "online", "телефон", "компьютер"],
};
const HEAVY = ["heavy", "piano", "fridge", "sofa", "wardrobe", "no elevator", "no lift", "stairs", "5th floor", "4th floor", "тяжел", "washing machine", "cement", "construction"];
const LONG = ["all day", "whole day", "weekend", "6 hours", "8 hours", "every day"];
const CARE = ["disabled", "wheelchair", "hospital", "medical", "sick", "инвалид"];
const BIG = ["park", "lake", "festival", "families", "community", "district", "marathon"];
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const has = (text, k) => new RegExp("(?<![\\p{L}\\d])" + reEsc(k), "u").test(text);
const hasWord = (text, k) => new RegExp("(?<![\\p{L}\\d])" + reEsc(k) + "(?![\\p{L}\\d])", "u").test(text);
const BASE_EFFORT = { moving: 2, eco: 1, events: 1, elderly: 1 };
const BASE_VOL = { moving: 3, eco: 8, events: 5, food: 4, animals: 2, elderly: 1, education: 1, tech: 1 };
const BASE_SKILLS = { elderly: ["Patience", "Kindness"], moving: ["Teamwork", "Physical fitness"], eco: ["Teamwork", "Waste sorting"], education: ["Teaching", "Clear explanations"], food: ["Organisation", "Food hygiene"], animals: ["Love for animals", "Calm attitude"], events: ["Event setup", "Communication"], tech: ["Smartphones", "Patience"] };

function analyze(title, desc) {
  const text = `${title} ${desc}`.toLowerCase().trim();
  if (text.length < 8) return null;
  const scores = Object.fromEntries(Object.entries(KW).map(([c, w]) => { const n = w.filter((k) => has(text, k)).length; return [c, c === "elderly" ? n * 2 : n]; }));
  const [bestCat, bestScore] = Object.entries(scores).sort((a, b) => b[1] - a[1])[0];
  const total = Object.values(scores).reduce((a, b) => a + b, 0);
  const cat = bestScore === 0 ? "events" : bestCat;
  const confidence = bestScore === 0 ? 35 : Math.min(97, Math.max(45, 55 + bestScore * 12 - (total - bestScore) * 5));
  const signals = [];
  if (bestScore > 0) signals.push(`Matched “${KW[cat].filter((k) => has(text, k)).slice(0, 3).join("”, “")}” → ${CATS[cat].label}`);
  else signals.push("No strong keywords yet. Add more details for a better match.");
  const heavy = HEAVY.filter((k) => has(text, k)), long = LONG.some((k) => has(text, k)), care = CARE.some((k) => has(text, k));
  let effort = BASE_EFFORT[cat] || 0;
  if (heavy.length) { effort += 2; signals.push(`Physical effort detected (“${heavy[0]}”)`); }
  if (long) { effort += 1; signals.push("Long duration mentioned"); }
  if (care) { effort += 1; signals.push("Sensitive care context; experience helps"); }
  const diff = effort >= 4 ? "demanding" : effort >= 2 ? "moderate" : "easy";
  let vols = BASE_VOL[cat] + (heavy.length ? 1 : 0) + (BIG.some((k) => has(text, k)) ? 2 : 0);
  const m = text.match(/(\d{1,2})\s*(volunteers|people|helpers|человек)/);
  if (m) { vols = +m[1]; signals.push("Team size taken from your text"); }
  vols = Math.min(30, Math.max(1, vols));
  const skills = [...BASE_SKILLS[cat]];
  if (heavy.length) skills.push("Heavy lifting");
  if (["car", "drive", "driving", "truck"].some((k) => hasWord(text, k))) skills.push("Driving licence");
  if (has(text, "english")) skills.push("English");
  if (has(text, "kazakh") || has(text, "қазақ")) skills.push("Kazakh language");
  if (has(text, "kid") || has(text, "child")) skills.push("Childcare experience");
  if (care) skills.push("First aid basics");
  return { cat, confidence, diff, vols, skills: [...new Set(skills)].slice(0, 5), signals };
}

/* ---------------- simulated AI: review verification ---------------- */
// Flags unusual claims for a human to double-check. Never declares fraud.
const SOLO = ["alone", "by himself", "by herself", "by myself", "single-handedly", "on his own", "on her own", "one volunteer", "один", "одна", "сам ", "сама "];
const SUPER = ["best ever", "perfect", "incredible", "amazing", "unbelievable", "superhero", "miracle", "legendary", "100%", "flawless"];
const NEG = ["late", "rude", "didn't come", "did not come", "no-show", "careless", "bad"];
const CLAIMS = [
  "One volunteer carried a 500 kg piano alone up to the 3rd floor.",
  "Dana helped with groceries, arrived on time and was very kind to my grandmother.",
  "Amazing, incredible, perfect, best ever volunteer!!! A real superhero.",
  "We worked 20 hours straight without a break and cleaned the whole park.",
];
function verify(text, rating, teamSize) {
  const t = String(text).toLowerCase(); const flags = []; let s = 96;
  const kg = Math.max(-1, ...[...t.matchAll(/(\d{2,4})\s*(kg|kilo|кг)/g)].map((x) => +x[1]));
  const solo = SOLO.some((w) => t.includes(w)) || teamSize === 1;
  if (kg > 80 && solo) { s -= 55; flags.push(["Physically unusual claim", `One person moving ~${kg} kg unaided is far above typical safe limits (~80 kg). It may be a typo, exaggeration or missing context.`]); }
  else if (kg > 300) { s -= 15; flags.push(["Large weight mentioned", "Confirm how many people shared the load."]); }
  const hrs = Math.max(-1, ...[...t.matchAll(/(\d{1,3})\s*(hours|hrs|часов)/g)].map((x) => +x[1]));
  if (hrs > 16) { s -= 30; flags.push(["Unusual duration", `${hrs} hours of continuous volunteering in one task is uncommon.`]); }
  const helped = t.match(/(?:helped|fed|saved|cleaned)\s+(\d{3,6})/);
  if (helped && +helped[1] >= 500 && solo) { s -= 30; flags.push(["Large impact by one person", `Helping ${helped[1]} people single-handedly would normally need a team.`]); }
  const sup = SUPER.filter((w) => t.includes(w)).length;
  if (sup >= 3) { s -= 12; flags.push(["Very promotional tone", "Several superlatives in one short review. Usually fine, just worth a glance."]); }
  if (rating != null) {
    const neg = NEG.filter((w) => t.includes(w)).length;
    if (rating >= 5 && neg >= 2) { s -= 15; flags.push(["Rating and text disagree", "5 stars, but the text sounds negative."]); }
    else if (rating <= 2 && sup >= 1 && neg === 0) { s -= 15; flags.push(["Rating and text disagree", "Low rating, but the text is very positive."]); }
  }
  const len = t.trim().length;
  if (len > 0 && len <= 12) { s -= 6; flags.push(["Very short review", "Short reviews carry less evidence."]); }
  s = Math.min(99, Math.max(3, s));
  const level = s < 60 ? "needs" : flags.length && s < 90 ? "light" : "ok";
  return { level, score: s, flags };
}
const LEVEL = { ok: ["Looks consistent", "p-primary"], light: ["Light review suggested", "p-amber"], needs: ["Needs additional verification", "p-danger"] };

/* ---------------- views: home ---------------- */
function visibleTasks() {
  const q = S.q.trim().toLowerCase();
  const list = S.tasks.filter((t) => !t.done)
    .filter((t) => !S.cat || t.cat === S.cat)
    .filter((t) => !q || [t.title, t.desc, t.area, CATS[t.cat].label].some((x) => x.toLowerCase().includes(q)));
  const mine = list.filter((t) => t.req.id === ME).sort((a, b) => b.createdAt - a.createdAt);
  const others = list.filter((t) => t.req.id !== ME).sort((a, b) => (S.sort === "nearest" ? a.dist - b.dist : a.date - b.date));
  return mine.concat(others);
}
function taskCard(t) {

    return accepted(t) ? `<button class="btn primary" data-act="openComplete" data-id="${t.id}">${icon("check")}Mark as completed</button>`
      : `<button class="btn primary" disabled>${pending(t) ? "Accept a volunteer to continue" : "Waiting for volunteers"}</button>`;
  }
  if (S.role === "requester" && !mya) return `<button class="btn secondary" data-act="role" data-v="volunteer">${icon("hand")}Switch to volunteer mode to apply</button>`;
  if (mya?.status === "pending") return `<div class="row" style="gap:12px">${appPill("pending")}<button class="btn secondary grow" data-act="withdraw" data-id="${t.id}">Withdraw application</button></div>`;

function myTasksView() {
  const tab = S.myTab ?? (S.role === "requester" ? 0 : 1);
  const reqs = myRequests(), apps = myApps();
  const pend = pendingForMe(), active = reqs.filter((t) => !t.done).length, upcoming = apps.filter((t) => appOf(t, ME).status === "accepted" && !t.done).length;
  const steps = (a, done) => {
    const rej = a.status === "rejected", reached = done ? 4 : a.status === "pending" ? 1 : 3;
    return `<div class="timeline">${["Applied", "Reviewed", rej ? "Declined" : "Confirmed", "Completed"].map((l, i) => `<div class="${rej && i === 2 ? "bad" : i < reached ? "on" : ""}"><i></i><span>${l}</span></div>`).join("")}</div>`;
  };
  const head = (t, right) => `<div class="sum-head">${catTile(t.cat, 42)}<div class="grow"><div class="t">${esc(t.title)}</div><div class="small muted">${friendly(t.date)} · ${esc(short(t.area))}</div></div>${right}${icon("chev", "s")}</div>`;
  let list;
  if (tab === 0) {
    list = reqs.length ? reqs.map((t) => {
      const pa = t.apps.filter((a) => a.status === "pending");
      return `<article class="card elev stack" style="gap:10px" data-act="open" data-id="${t.id}" role="button" tabindex="0">
        ${head(t, statusPill(status(t)))}
        <div class="row small"><b class="num grow" style="font-weight:600">${accepted(t)}/${t.need} volunteers</b><span class="${pa.length ? "accent" : "faint"}">${pa.length ? `${pa.length} new applicant${pa.length > 1 ? "s" : ""}` : "No new applicants"}</span></div>
        ${progress(accepted(t), t.need)}
        ${pa.length && !t.done ? (S.role === "requester" ? `<div class="list">${pa.slice(0, 2).map((a) => applicantHTML(t, a, false)).join("")}</div>` : `<button class="btn tonal md block" data-act="role" data-v="requester">Switch to requester mode to review</button>`) : ""}
        ${!t.done && accepted(t) && !pa.length && S.role === "requester" ? `<button class="btn tonal md block" data-act="open" data-id="${t.id}">Open to mark completed</button>` : ""}
      </article>`;
    }).join("") : empty("inbox", "No requests yet", "Post what you need and neighbours nearby will offer to help.", `<button class="btn primary sm" data-act="tab" data-v="create">${icon("plus", "s")}Create a request</button>`);
  } else {
    list = apps.length ? apps.map((t) => { const a = appOf(t, ME); return `<article class="card elev stack" style="gap:12px" data-act="open" data-id="${t.id}" role="button" tabindex="0">${head(t, t.done ? statusPill("done") : appPill(a.status))}${steps(a, t.done)}</article>`; }).join("")
      : empty("search", "You haven't applied yet", "Browse nearby requests and offer a hand. It takes a minute.", `<button class="btn primary sm" data-act="tab" data-v="home">Browse requests</button>`);
  }
  return `<div class="stack" style="gap:20px">
    <div><h1 class="page-h1">My tasks</h1><p class="sub-h">Track your requests and the help you've offered.</p></div>
    <div class="tiles num" style="max-width:640px"><div class="tile ${pend ? "hl" : ""}"><b>${pend}</b><span>to review</span></div><div class="tile"><b>${active}</b><span>active requests</span></div><div class="tile"><b>${upcoming}</b><span>upcoming helps</span></div></div>
    <div style="max-width:640px">${seg([{ v: 0, label: "My requests", icon: "megaphone" }, { v: 1, label: "Applications", icon: "hand" }], tab, "myTab")}</div>
    <div class="mt-list">${list}</div>
  </div>`;
}

/* ---------------- views: profile ---------------- */
function achievements() {
  const n = S.history.length, eco = S.history.some((h) => h.cat === "eco");
  return [
    ["trophy", "First helping hand", "Completed your first ASAR task", true, "Taza Almaty Initiative"],
    ["leaf", "Green Almaty", "Joined 2 eco initiatives", true, "Taza Almaty Initiative"],
    ["elderly", "Respect for elders", "Helped an elderly neighbour", true, "Saule Nurlanovna"],
    ["sparkle", "Asar in action", "Complete a task during this demo", n > 0, n > 0 ? "ASAR demo" : null],
    ["medal", "Ten good deeds", "Complete 10 tasks", HISTORY.length + n >= 10, null],
    ["leaf", "Eco champion", "Join 3 eco initiatives", eco, null],
  ];
}
function profileView() {
  const r = allRatings(), avg = r.reduce((a, b) => a + b, 0) / r.length;
  const hist = S.history.slice().reverse().concat(HISTORY);
  const reviews = S.tasks.flatMap((t) => t.reviews.filter((x) => x.vid === ME).map((x) => [t, x]));
  return `<div class="profile">
    <div class="ident"><div class="halo">${avatar(S.me.name, 94, true)}<span class="vb">${icon("check", "xs")}</span></div>
      <h1>${esc(S.me.name)}</h1><div class="muted">${esc(S.session.email)}</div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap;justify-content:center">${pill(`Member since ${S.me.since}`, "p-primary", { icon: "hand" })}${demoBadge(S.session.demo ? "Demo account" : "Local account")}</div></div>
    <div>${roleSeg()}</div>
    <section class="stack" style="gap:12px">
      <div class="row"><h2 class="grow" style="font-size:20px">Your impact</h2>${demoBadge()}</div>
      <div class="tiles num">
        <div class="tile stat"><span style="color:var(--sand)">${icon("star")}</span><b>${avg.toFixed(1)}</b><span>${r.length} reviews</span></div>
        <div class="tile stat">${icon("trophy")}<b>${HISTORY.length + S.history.length}</b><span>tasks done</span></div>
        <div class="tile stat">${icon("hand")}<b>${HISTORY.reduce((a, h) => a + h.h, 0) + S.hours}h</b><span>hours given</span></div>
      </div>
    </section>
    <section class="stack" style="gap:12px">
      <div><h2 style="font-size:20px">Verified achievements</h2><p class="small muted">Confirmed by the people you helped (demo)</p></div>
      <div class="ach-grid">${achievements().map(([ic, t, d, earned, by]) => `<div class="card ach ${earned ? "" : "locked"}"><span class="ai-ic">${icon(earned ? ic : "lock")}</span><b>${esc(t)}</b><span class="small muted">${esc(d)}</span>${by ? `<span class="by">${icon("verified", "xs")}by ${esc(by)}</span>` : ""}</div>`).join("")}</div>
    </section>
    <div class="card lab-card" data-act="openLab" role="button" tabindex="0"><span class="li">${icon("sparkle", "l")}</span><div class="grow"><b style="font-size:16px">ASAR Assist lab</b><div class="small muted">Try the task analyzer and review verification</div><div style="margin-top:6px">${aiBadge()}</div></div><span style="color:var(--info)">${icon("chev")}</span></div>
    ${reviews.length ? `<section class="stack" style="gap:12px"><div><h2 style="font-size:20px">Reviews about you</h2><p class="small muted">${reviews.length} published</p></div><div class="list">${reviews.map(([t, x]) => `<div data-act="open" data-id="${t.id}" role="button" tabindex="0" style="cursor:pointer">${reviewHTML(x, t.title)}</div>`).join("")}</div></section>` : ""}
    <section class="stack" style="gap:12px"><div><h2 style="font-size:20px">Participation history</h2><p class="small muted">Your recent helping hands</p></div>
      <div class="card hist">${hist.map((h) => `<div class="hr">${catTile(h.cat, 40)}<div class="grow"><div class="t">${esc(h.title)}</div><div class="small muted num">${esc(h.when)} · ${h.h}h</div></div>${h.r ? stars(h.r) : ""}</div>`).join("")}</div></section>
    <p class="small faint" style="text-align:center">All ratings, counts and achievements on this page are demo data kept in memory in this browser tab. ASAR is a hackathon prototype.</p>
    <button class="btn secondary block danger-text" data-act="logout">${icon("logout")}Sign out</button>
  </div>`;
}

/* ---------------- views: AI lab ---------------- */
const TASK_SAMPLES = ["Need 3 people to carry a piano to the 4th floor, no elevator", "Teach my grandfather to use video calls on his smartphone", "Saturday cleanup of plastic litter around Sairan lake", "Walk shelter dogs and help clean the kennels"];
function labTaskResult() { const a = analyze("", S.lab.task); return a ? analysisHTML(a, { title: "Analysis" }) : ""; }
function labReviewResult() { return `<div class="card"><b style="font-size:16px;display:block;margin-bottom:10px">Result</b>${verificationHTML(verify(S.lab.review, S.lab.rating, null))}</div>`; }
function labView() {
  return `<div class="back-row"><button class="icon-btn" data-act="back" aria-label="Back">${icon("back")}</button><span class="grow">ASAR Assist lab</span>${aiBadge()}</div>
  <div class="lab">
    <div class="notice info">${icon("info")}<div><b>Simulated AI demonstration.</b> These features use transparent, rule-based logic that runs in your browser. They are not connected to any real AI model or online service. They show how ASAR could assist people in a production version.</div></div>
    <section><h2>Task analyzer</h2><p class="muted">Suggests a category, difficulty, team size and skills from keywords.</p>
      <div class="hscroll">${TASK_SAMPLES.map((s, i) => `<button class="sample" data-act="labTask" data-i="${i}" title="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <textarea class="input" id="lab-task" rows="3" aria-label="Task description">${esc(S.lab.task)}</textarea>
      <div id="lab-task-out">${labTaskResult()}</div></section>
    <section><h2>Review verification</h2><p class="muted">Flags physically unusual or inconsistent claims for a person to double-check. It never labels anyone a fraud.</p>
      <div class="hscroll">${CLAIMS.map((s, i) => `<button class="sample" data-act="labClaim" data-i="${i}" title="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <textarea class="input" id="lab-review" rows="3" aria-label="Review text">${esc(S.lab.review)}</textarea>
      <div class="row"><b class="small" style="width:56px">Rating</b><div class="rate">${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="${n <= S.lab.rating ? "on" : ""}" data-act="labRate" data-v="${n}" aria-label="${n} stars">${icon("star")}</button>`).join("")}</div></div>
      <div id="lab-review-out">${labReviewResult()}</div></section>
  </div>`;
}

function refreshPreview(i) {
  const d = S.sheet.drafts[i];
  $("#vp-" + i).innerHTML = verificationHTML(verify(d.text, d.rating, S.sheet.drafts.length));
}

/* ---------------- render ---------------- */
function render() {
  $("#app").innerHTML = S.session ? shell() : S.auth ? authView() : welcomeView();
  if (S.sheet) S.sheet.fresh = false; // slide-in plays only when a sheet first opens
}
function go(fn) { fn(); render(); }
function push(entry) { if (!S.stack.length) S.scroll[S.tab] = window.scrollY; S.stack.push(entry); render(); window.scrollTo(0, 0); }

/* ---------------- actions ---------------- */
const A = {
  demo: () => startSession(S.accounts[DEMO_EMAIL]),
  goAuth: (el) => go(() => { S.auth = el.dataset.v; S.authF.err = ""; }),
  authBack: () => go(() => { S.auth = null; }),
  authMode: (el) => go(() => { S.auth = el.dataset.v; S.authF.err = ""; }),
  togglePw: () => go(() => { S.authF.show = !S.authF.show; }),
  fillDemo: () => go(() => { S.auth = "login"; Object.assign(S.authF, { email: DEMO_EMAIL, pass: DEMO_PASS, err: "" }); }),
  logout: () => go(() => { S.session = null; S.auth = null; S.stack = []; S.sheet = null; window.scrollTo(0, 0); }),

  tab: (el) => { S.stack = []; S.sheet = null; const v = el.dataset.v; if (v === "mytasks") S.myTab = null; S.tab = v; render(); window.scrollTo(0, v === "home" ? (S.scroll.home || 0) : 0); },
  role: (el) => { const r = el.dataset.v; if (r === S.role) return; S.role = r; S.myTab = null; render(); toast(r === "volunteer" ? "Volunteer mode: find someone to help" : "Requester mode: manage your requests"); },
  cat: (el) => go(() => { S.cat = el.dataset.v || null; }),
  sort: () => go(() => { S.sort = S.sort === "nearest" ? "soonest" : "nearest"; }),
  clearQ: (el, e) => { e.preventDefault(); S.q = ""; render(); $("#q")?.focus(); },
  open: (el) => push({ type: "task", id: el.dataset.id }),
  apply: (el) => { push({ type: "task", id: el.dataset.id }); A.openApply(el); },
  back: () => { S.stack.pop(); S.sheet = null; render(); window.scrollTo(0, S.stack.length ? 0 : (S.scroll[S.tab] || 0)); },
  myTab: (el) => go(() => { S.myTab = +el.dataset.v; }),
  openLab: () => push({ type: "lab" }),

  openApply: (el) => { const t = task(el.dataset.id); if (!t || appOf(t, ME) || status(t) !== "open" || S.role !== "volunteer") return; S.sheet = { fresh: true, type: "apply", id: t.id, note: "Sälem! I'm nearby and free at that time. Happy to help." }; render(); setTimeout(() => $("#apply-note")?.focus(), 50); },
  closeSheet: () => go(() => { S.sheet = null; }),
  sendApply: () => {
    const t = task(S.sheet.id); const note = S.sheet.note.trim() || "I'd be glad to help!";
    update(t.id, (x) => ({ ...x, apps: [...x.apps, app("a-" + uid(), S.me, note, "pending", 0)] }));
    S.sheet = null; render(); toast(`Application sent to ${t.req.name.split(" ")[0]}`);
  },
  withdraw: (el) => { update(el.dataset.id, (x) => ({ ...x, apps: x.apps.filter((a) => !(a.v.id === ME && a.status === "pending")) })); render(); toast("Application withdrawn"); },
  accept: (el, e) => {
    e.stopPropagation(); let name = "";
    update(el.dataset.id, (x) => (spots(x) === 0 ? x : { ...x, apps: x.apps.map((a) => (a.id === el.dataset.a ? ((name = a.v.name.split(" ")[0]), { ...a, status: "accepted" }) : a)) }));
    render(); if (name) toast(`${name} is on your team`);
  },
  reject: (el, e) => { e.stopPropagation(); update(el.dataset.id, (x) => ({ ...x, apps: x.apps.map((a) => (a.id === el.dataset.a ? { ...a, status: "rejected" } : a)) })); render(); toast("Application declined politely"); },
  openComplete: (el) => {
    const t = task(el.dataset.id);
    S.sheet = { fresh: true, type: "complete", id: t.id, drafts: t.apps.filter((a) => a.status === "accepted").map((a) => ({ v: a.v, rating: 5, text: "Arrived on time, kind and very helpful. Rahmet!" })) };
    render();
  },
  rate: (el) => {
    const i = +el.dataset.i, v = +el.dataset.v, d = S.sheet.drafts[i]; d.rating = v;
    el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.v <= v));
    refreshPreview(i);
  },
  tryClaim: (el) => { const i = +el.dataset.i; S.sheet.drafts[i].text = CLAIMS[0]; $("#rv-" + i).value = CLAIMS[0]; refreshPreview(i); },
  completeTask: () => {
    const t = task(S.sheet.id), team = S.sheet.drafts.length;
    const reviews = S.sheet.drafts.map((d) => ({ vid: d.v.id, vname: d.v.name, author: t.req.name, rating: d.rating, text: d.text.trim(), ver: verify(d.text, d.rating, team) }));
    update(t.id, (x) => ({ ...x, done: true, reviews: [...x.reviews, ...reviews] }));
    const mine = reviews.find((r) => r.vid === ME);
    if (mine) { const h = { easy: 1, moderate: 3, demanding: 4 }[t.diff]; S.ratings.push(mine.rating); S.hours += h; S.history.push({ title: t.title, cat: t.cat, when: "Today", h, r: mine.rating }); }
    S.sheet = null; render(); toast("Task completed. Thank you for keeping asar alive");
  },

  example: (el) => { const x = EXAMPLES[+el.dataset.i]; S.draft.title = x[1]; S.draft.desc = x[2]; render(); },
  useSuggest: () => { const a = analyze(S.draft.title, S.draft.desc); if (!a) return; Object.assign(S.draft, { cat: a.cat, vols: a.vols, skills: a.skills, diff: a.diff }); render(); },
  dCat: (el) => go(() => { S.draft.cat = el.dataset.v; }),
  dArea: (el) => go(() => { S.draft.area = el.dataset.v; }),
  dDay: (el) => go(() => { S.draft.day = +el.dataset.v; }),
  dHour: (el) => go(() => { S.draft.hour = +el.dataset.v; }),
  step: (el) => go(() => { S.draft.vols = Math.min(30, Math.max(1, S.draft.vols + +el.dataset.v)); }),
  publish: () => {
    const d = S.draft, err = createErrors();
    if (err.title || err.desc || err.cat) { d.errors = true; render(); toast("Please complete the highlighted fields"); return; }
    const a = analyze(d.title, d.desc); const date = new Date(); date.setDate(date.getDate() + d.day); date.setHours(d.hour, 0, 0, 0);
    S.tasks.unshift({ id: "t-" + uid(), title: d.title.trim(), desc: d.desc.trim(), cat: d.cat, area: d.area, dist: 0.4, date, dur: { easy: "~1 hour", moderate: "~2–3 hours", demanding: "~4 hours" }[d.diff], need: d.vols, req: S.me, skills: d.skills.length ? d.skills : a?.skills || ["Kindness"], diff: d.diff, apps: [], done: false, reviews: [], createdAt: Date.now() });
    S.draft = newDraft(); S.role = "requester"; S.tab = "home"; S.cat = null; S.q = ""; S.scroll.home = 0;
    render(); window.scrollTo(0, 0); toast("Request published. It's live on Home");
  },

  labTask: (el) => { S.lab.task = TASK_SAMPLES[+el.dataset.i]; render(); },
  labClaim: (el) => { S.lab.review = CLAIMS[+el.dataset.i]; render(); },
  labRate: (el) => {
    const v = +el.dataset.v; S.lab.rating = v;
    el.parentElement.querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.v <= v));
    $("#lab-review-out").innerHTML = labReviewResult();
  },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { if (el.tagName === "BUTTON" && el.type !== "submit") e.preventDefault(); fn(el, e); }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape" && S.sheet) A.closeSheet();
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "auth-form") return;
  e.preventDefault();
  const f = S.authF, email = f.email.trim().toLowerCase();
  if (S.auth === "register") {
    f.err = !f.name.trim() ? "Please enter your name." : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? "Please enter a valid email address." : f.pass.length < 6 ? "Password must be at least 6 characters." : S.accounts[email] ? "An account with this email already exists. Sign in instead." : "";
    if (f.err) return render();
    S.accounts[email] = { name: f.name.trim(), email, pass: f.pass };
  } else {
    const acc = S.accounts[email];
    if (!acc || acc.pass !== f.pass) { f.err = "Email or password is incorrect."; return render(); }
  }
  const acc = S.accounts[email]; S.authF = { name: "", email: "", pass: "", show: false, err: "" }; startSession(acc);
});
document.addEventListener("input", (e) => {
  const el = e.target, v = el.value;
  switch (el.id) {
    case "f-name": S.authF.name = v; break;
    case "f-email": S.authF.email = v; break;
    case "f-pass": S.authF.pass = v; break;
    case "q": S.q = v; $("#feed").innerHTML = feedHTML(); $("#count").textContent = `${visibleTasks().length} in Almaty · updated just now`; el.parentElement.querySelector(".clear").hidden = !v; break;
    case "d-title": S.draft.title = v; $("#ai-slot").innerHTML = aiSlotHTML(); break;
    case "d-desc": S.draft.desc = v; $("#ai-slot").innerHTML = aiSlotHTML(); break;
    case "apply-note": S.sheet.note = v; break;
    case "lab-task": S.lab.task = v; $("#lab-task-out").innerHTML = labTaskResult(); break;
    case "lab-review": S.lab.review = v; $("#lab-review-out").innerHTML = labReviewResult(); break;
    default: {
      const m = el.id.match(/^rv-(\d+)$/);
      if (m && S.sheet) { S.sheet.drafts[+m[1]].text = v; refreshPreview(+m[1]); }
    }
  }
});

render();
})();
</script>
</body>
</html>
